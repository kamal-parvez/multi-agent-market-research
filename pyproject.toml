[project]
name = "market-research"
version = "0.1.0"
description = "Multi-agent LLM pipeline for automated marketing campaign research, built on LangGraph and Gemini."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.0.0",
    "huggingface_hub>=0.25.0",
    "langgraph>=0.2.0",
    "tavily-python>=0.5.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pillow>=10.0.0",
]

[project.scripts]
market-research = "market_research.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_research"]
